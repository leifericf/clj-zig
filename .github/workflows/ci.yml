name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (clj-kondo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeLaGuardo/setup-clj-kondo@master
        with:
          version: "2026.05.25"
      - run: clj-kondo --lint src test script --fail-level error

  reflection:
    name: Reflection gate
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: "1.12.5.1654"

      - name: Cache Clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            .cpcache
          key: ${{ runner.os }}-deps-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Fail on reflective interop
        run: clojure -M:lint-reflection

  test:
    name: Test (Java ${{ matrix.java }} on ${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ["22", "26"]
        # Java 22 is the supported floor (FFM finalized, JEP 454); the 22
        # lane guards against accidental use of a 23+/26+-only API that
        # would break the "Java 22+" claim. That coverage is Java-version
        # behavior and belongs on one OS -- Linux is cheapest. macOS and
        # Windows run the dev version (26); their job is platform-specific
        # behavior (library suffixes, loading, paths), which is orthogonal
        # to the Java version. 4 lanes instead of 6.
        exclude:
          - os: macos-latest
            java: "22"
          - os: windows-latest
            java: "22"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          # Pinned, not `latest`: setup-clojure derives the clj-msi tag from
          # the brew-install tag, and the two repos drift when the Clojure
          # core team cuts a brew-install release before the clj-msi port
          # catches up. Pinning to a version that exists on both keeps the
          # Windows lane from failing on upstream release timing.
          cli: "1.12.5.1654"

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache Clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            .cpcache
          key: ${{ runner.os }}-deps-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Cache compiled Zig libraries
        uses: actions/cache@v4
        with:
          path: .clj-zig
          key: ${{ runner.os }}-zig0.16-${{ hashFiles('src/**/*.clj') }}
          restore-keys: |
            ${{ runner.os }}-zig0.16-

      - name: Run tests
        run: clojure -M:test

  perf-gate:
    name: Perf ratio gate
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: "1.12.5.1654"

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache Clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            .cpcache
          key: ${{ runner.os }}-deps-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Cache compiled Zig libraries
        uses: actions/cache@v4
        with:
          path: .clj-zig
          key: ${{ runner.os }}-zig0.16-${{ hashFiles('src/**/*.clj') }}
          restore-keys: |
            ${{ runner.os }}-zig0.16-

      - name: Gate per-call overhead ratio
        run: clojure -M:bench --gate
